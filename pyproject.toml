[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "scrapinghub-entrypoint-scrapy"
description = "Scrapy entrypoint for Scrapinghub job runner"
dependencies = [
    "Scrapy>=2.7",
    "Twisted>=21.7.0",
    "scrapinghub>=2.4.0",
]
classifiers = [
    "Framework :: Scrapy",
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Utilities",
]
license = "BSD-3-Clause"
license-files = ["LICENSE"]
readme = "README.rst"
requires-python = ">=3.10"
dynamic = ["version"]

[project.urls]
Homepage = "https://github.com/scrapinghub/scrapinghub-entrypoint-scrapy"
Source = "https://github.com/scrapinghub/scrapinghub-entrypoint-scrapy"
Issues = "https://github.com/scrapinghub/scrapinghub-entrypoint-scrapy/issues"
"Release notes" = "https://github.com/scrapinghub/scrapinghub-entrypoint-scrapy/blob/master/CHANGES.rst"

[project.scripts]
start-crawl = "sh_scrapy.crawl:main"
list-spiders = "sh_scrapy.crawl:list_spiders"
shub-image-info = "sh_scrapy.crawl:shub_image_info"

[tool.hatch.version]
path = "sh_scrapy/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["sh_scrapy"]

[tool.hatch.build.targets.sdist]
include = [
    "/sh_scrapy",
    "/tests",
    "/CHANGES.rst",
    "/codecov.yml",
    "/tox.ini",
]

[tool.bumpversion]
current_version = "0.18.1"
commit = true
tag = true
tag_name = "v{new_version}"

[[tool.bumpversion.files]]
filename = "CHANGES.rst"
search = "\\(unreleased\\)$"
replace = "({now:%Y-%m-%d})"
regex = true

[[tool.bumpversion.files]]
filename = "sh_scrapy/__init__.py"

[tool.coverage.run]
branch = true
include = ["sh_scrapy/*"]
omit = ["tests/*"]

[tool.coverage.paths]
source = [
    "sh_scrapy",
    ".tox/**/site-packages/sh_scrapy",
]

[tool.mypy]

[[tool.mypy.overrides]]
module = "tests.*"
allow_untyped_defs = true
check_untyped_defs = false

# Components whose methods are defined conditionally to support several Scrapy
# versions; mypy cannot express a signature that varies per branch.
[[tool.mypy.overrides]]
module = [
    "sh_scrapy.diskquota",
    "sh_scrapy.middlewares",
    "sh_scrapy.stats",
]
disable_error_code = ["misc", "override"]

# TODO
[[tool.mypy.overrides]]
module = "sh_scrapy.extension"
ignore_errors = true

# usually no type hints
[[tool.mypy.overrides]]
module = [
    "boto",
    "hubstorage.*",
    "raven",
    "scrapinghub.*",
    "scrapy_spider_metadata",
    "slybot.*",
]
ignore_missing_imports = true

[tool.pylint.MASTER]
persistent = "no"

[tool.pylint."MESSAGES CONTROL"]
enable = [
    "useless-suppression",
]
disable = [
    # Ones we want to ignore
    "attribute-defined-outside-init",
    "consider-using-get",
    "consider-using-with",
    "disallowed-name",
    "fixme",
    "invalid-name",
    "line-too-long",
    "logging-fstring-interpolation",
    "missing-class-docstring",
    "missing-function-docstring",
    "missing-module-docstring",
    "protected-access",
    "redefined-outer-name",
    "too-few-public-methods",
    "too-many-arguments",
    "too-many-instance-attributes",
    "too-many-positional-arguments",
    "too-many-statements",
    "unspecified-encoding",
    "unused-argument",
    "use-implicit-booleaness-not-comparison",
    "wrong-import-position",

    # Ones that are implemented in ruff and need to be disabled for some lines
    "bare-except",
    "broad-exception-caught",
    "exec-used",
    "import-outside-toplevel",
    "unused-import",

    # False positives on the Scrapy version compatibility branches and on mocks
    "arguments-differ",
    "comparison-with-callable",
    "duplicate-code",  # https://github.com/pylint-dev/pylint/issues/214
    "method-hidden",
    "no-member",
    "no-name-in-module",
    "no-value-for-parameter",
    "unsubscriptable-object",
    "unsupported-membership-test",
    "used-before-assignment",
]

[tool.pytest.ini_options]
filterwarnings = [
    # https://github.com/scrapinghub/python-scrapinghub/commit/d1d3df0db5be926999ab71086f83ae8a7120e781
    "ignore::DeprecationWarning:scrapinghub\\.hubstorage\\.serialization",
]

[tool.ruff.lint]
extend-select = [
    # flake8-builtins
    "A",
    # flake8-async
    "ASYNC",
    # flake8-bugbear
    "B",
    # flake8-comprehensions
    "C4",
    # flake8-commas
    "COM",
    # pydocstyle
    "D",
    # flake8-future-annotations
    "FA",
    # flynt
    "FLY",
    # refurb
    "FURB",
    # isort
    "I",
    # flake8-implicit-str-concat
    "ISC",
    # flake8-logging
    "LOG",
    # Perflint
    "PERF",
    # pygrep-hooks
    "PGH",
    # flake8-pie
    "PIE",
    # pylint
    "PL",
    # flake8-pytest-style
    "PT",
    # flake8-use-pathlib
    "PTH",
    # flake8-pyi
    "PYI",
    # flake8-quotes
    "Q",
    # flake8-return
    "RET",
    # flake8-raise
    "RSE",
    # Ruff-specific rules
    "RUF",
    # flake8-bandit
    "S",
    # flake8-simplify
    "SIM",
    # flake8-slots
    "SLOT",
    # flake8-debugger
    "T10",
    # flake8-type-checking
    "TC",
    # flake8-tidy-imports
    "TID",
    # pyupgrade
    "UP",
    # pycodestyle warnings
    "W",
    # flake8-2020
    "YTT",
]
ignore = [
    # Do not catch blind exception
    "BLE001",
    # Trailing comma missing
    "COM812",
    # Missing docstring in public module
    "D100",
    # Missing docstring in public class
    "D101",
    # Missing docstring in public method
    "D102",
    # Missing docstring in public function
    "D103",
    # Missing docstring in public package
    "D104",
    # Missing docstring in magic method
    "D105",
    # Missing docstring in public nested class
    "D106",
    # Missing docstring in __init__
    "D107",
    # One-line docstring should fit on one line with quotes
    "D200",
    # No blank lines allowed after function docstring
    "D202",
    # 1 blank line required between summary line and description
    "D205",
    # Multi-line docstring closing quotes should be on a separate line
    "D209",
    # First line should end with a period
    "D400",
    # First line should be in imperative mood; try rephrasing
    "D401",
    # First line should not be the function's "signature"
    "D402",
    # First word of the first line should be properly capitalized
    "D403",
    # `try`-`except` within a loop incurs performance overhead
    "PERF203",
    # Imports are deferred so that import errors reach the Sentry handler in
    # sh_scrapy.crawl, and so that optional dependencies stay optional.
    "PLC0415",
    # Too many return statements
    "PLR0911",
    # Too many branches
    "PLR0912",
    # Too many arguments in function definition
    "PLR0913",
    # Too many statements
    "PLR0915",
    # Too many positional arguments
    "PLR0917",
    # Magic value used in comparison
    "PLR2004",
    # String contains ambiguous {}.
    "RUF001",
    # Docstring contains ambiguous {}.
    "RUF002",
    # Comment contains ambiguous {}.
    "RUF003",
    # Mutable class attributes should be annotated with `typing.ClassVar`
    "RUF012",
    # Use of `assert` detected
    "S101",
    # The named pipe stays open for the lifetime of the job
    "SIM115",
]

[tool.ruff.lint.isort]
split-on-trailing-comma = false

[tool.ruff.lint.per-file-ignores]
# Environment variables must be set before importing sh_scrapy.writer.
"tests/conftest.py" = ["E402"]

"tests/**" = [
    # Skip bandit in tests
    "S",
    # `pytest.raises(ValueError)` is too broad
    "PT011",
]

[tool.ruff.lint.pydocstyle]
convention = "pep257"
