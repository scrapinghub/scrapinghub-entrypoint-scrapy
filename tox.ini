[tox]
envlist = min,min-extra-deps,py,asyncio,extra-deps,pre-commit,pylint,typing,twinecheck
requires =
    tox-uv

[testenv]
deps =
    pytest
    pytest-cov
    pytest-twisted
    hubstorage
    packaging
    min: Scrapy==2.7
    min: Twisted==21.7.0
    # Scrapy 2.7 imports pkg_resources, dropped by setuptools 81.
    min: setuptools<81
commands =
    pytest --reactor=default --verbose --cov=sh_scrapy --cov-report=term-missing --cov-report=html --cov-report=xml {posargs: sh_scrapy tests}

[testenv:asyncio]
commands =
    pytest --reactor=asyncio --verbose --cov=sh_scrapy --cov-report=term-missing --cov-report=html --cov-report=xml {posargs: sh_scrapy tests}

# Optional dependencies. The other test environments run without them, to
# cover the code paths taken when they are missing.
[testenv:extra-deps]
deps =
    {[testenv]deps}
    scrapy-spider-metadata>=0.1.1
    pydantic>=2

[testenv:min-extra-deps]
deps = {[testenv:extra-deps]deps}

[testenv:pre-commit]
deps = pre-commit
commands = pre-commit run --all-files --show-diff-on-failure
skip_install = true

[testenv:pylint]
deps =
    {[testenv]deps}
    pylint==4.0.9
commands =
    pylint {posargs:sh_scrapy tests}

[testenv:typing]
deps =
    mypy==2.3.1
    pytest==9.1.1
commands =
    mypy {posargs:sh_scrapy tests}

[testenv:twinecheck]
deps =
    twine==7.0.0
    build==1.6.1
commands =
    python -m build --sdist
    twine check dist/*
